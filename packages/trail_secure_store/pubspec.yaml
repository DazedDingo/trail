name: trail_secure_store
description: >-
  Trail's own Keystore-backed secret store and DB-key escrow. A local
  Flutter plugin so `GeneratedPluginRegistrant` registers it in EVERY
  engine — the UI one and WorkManager's background one alike.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.5.0
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  # sha256 fingerprint of the escrowed key — the same digest the Kotlin
  # side writes next to the blob, so a warm open costs a prefs read.
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.dazeddingo.trail_secure_store
        pluginClass: TrailSecureStorePlugin
