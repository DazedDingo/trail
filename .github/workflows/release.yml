name: release

on:
  push:
    branches: [main]
    # Docs / CI / test-only pushes must NOT rebuild + re-publish the current
    # version: the tag already exists and action-gh-release would overwrite
    # the shipped APK with a rebuild on whatever Flutter stable is current.
    # (Hit on 2026-08-22 by a docs-only push; run cancelled by hand.)
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'test/**'
      - 'integration_test/**'
      - '.github/**'
      - 'tools/**'
      - 'LICENSE'

env:
  # The SHA-1 the APK MUST be signed with — matches the committed keystore
  # at android/app/debug.keystore. If this value drifts at build time the
  # build fails loudly instead of shipping an unsignable-upgrade APK.
  EXPECTED_SHA1: 67:25:31:A5:72:75:DC:16:F4:F6:6A:14:8F:D7:78:B0:E3:65:C8:EC

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify pinned keystore is present
        # The keystore lives in-tree at android/app/debug.keystore so both
        # local and CI builds sign identically. If it's missing something
        # wiped it and we must not ship — a regenerated keystore would give
        # every user an "upgrade requires uninstall" surprise.
        run: |
          if [ ! -f android/app/debug.keystore ]; then
            echo "::error::android/app/debug.keystore is missing from the checkout."
            exit 1
          fi
          if ! keytool -list -keystore android/app/debug.keystore \
              -storepass android -alias androiddebugkey > /dev/null 2>&1; then
            echo "::error::Pinned keystore is unreadable with the default password."
            exit 1
          fi
          echo "Pinned keystore fingerprint:"
          keytool -list -v -keystore android/app/debug.keystore \
            -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - run: flutter pub get

      - name: Build APK
        # Per-ABI APKs (PERF_PLAN §3 #20): R8 + resource shrinking are now
        # enabled (android/app/build.gradle.kts), and --split-per-abi builds
        # one APK per architecture instead of one fat APK containing all
        # three sets of native libraries — each install only downloads the
        # ~1 architecture's worth of native code it actually needs.
        #
        # versionCode is NOT the plain pubspec build number here. When
        # --split-per-abi is set, the Flutter Gradle plugin overrides each
        # output's versionCode with `abiIndex * 1000 + <pubspec build
        # number>` (flutter_tools/gradle/src/main/kotlin/FlutterPlugin.kt:
        # `output.versionCodeOverride = abiVersionCode * 1000 + (...)`),
        # using this ABI -> index mapping (FlutterPluginConstants.kt):
        #   armeabi-v7a -> 1   arm64-v8a -> 2   x86_64 -> 4
        # (index 3 was reserved for x86, whose support Flutter later
        # dropped — the gap is intentional, not a bug.)
        # So for pubspec build number 96 the three APKs ship versionCode
        # 1096 / 2096 / 4096, not 96. This is a one-way door: a future fat
        # APK built with a plain versionCode (e.g. 97) would be LOWER than
        # an existing per-ABI install's 1096/2096/4096 and Android would
        # reject it as a downgrade. If Trail ever needs to go back to a
        # single fat APK, the versionCode must be bumped past the highest
        # per-ABI value any user could already have installed.
        run: flutter build apk --release --split-per-abi

      - name: Verify APKs are signed with the expected keystore
        # If AGP sidesteps our pinned signingConfig for any reason, an APK's
        # cert SHA-1 will not match EXPECTED_SHA1 and this step fails. That
        # stops us from ever shipping a release that can't upgrade existing
        # installs. --split-per-abi produces one APK per ABI, so loop over
        # all of them — a mismatch on any single one must fail the build.
        run: |
          APKSIGNER=$(ls -t $ANDROID_HOME/build-tools/*/apksigner 2>/dev/null | head -1)
          if [ -z "$APKSIGNER" ]; then
            echo "::error::apksigner not found in $ANDROID_HOME/build-tools"
            exit 1
          fi
          echo "Using apksigner: $APKSIGNER"
          EXPECTED_COMPACT=$(echo "$EXPECTED_SHA1" | tr -d ':' | tr 'A-F' 'a-f')
          for APK in build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
                     build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
                     build/app/outputs/flutter-apk/app-x86_64-release.apk; do
            echo "--- $APK ---"
            CERTS=$("$APKSIGNER" verify --print-certs "$APK")
            echo "$CERTS"
            ACTUAL=$(echo "$CERTS" | grep -i 'SHA-1 digest' | awk '{print $NF}')
            if [ "$ACTUAL" != "$EXPECTED_COMPACT" ]; then
              echo "::error::$APK signed with $ACTUAL but expected $EXPECTED_COMPACT — existing installs will reject the upgrade."
              exit 1
            fi
            echo "✓ $APK signed with the pinned keystore."
          done

      - name: Get version from pubspec
        id: version
        # Tag and asset names include the build number so every push gets
        # its own release. Using `+` in tags works on GitHub but URL-encodes
        # to `%2B`, which clutters the release URL — so we replace `+` with
        # `-` for the tag (and asset filename), keeping the canonical
        # `0.8.0+31` only inside the human-facing release name and the
        # CHANGELOG. Result:
        #   tag:    v0.8.0-31
        #   name:   v0.8.0+31
        #   asset:  Trail-v0.8.0-31.apk
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build=$BUILD" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION-$BUILD" >> $GITHUB_OUTPUT
          echo "name=v$VERSION+$BUILD" >> $GITHUB_OUTPUT

      - name: Extract CHANGELOG section for this release
        id: changelog
        # Pull the section between `## [vX.Y.Z+N]` and the next `## ` header
        # so GitHub Releases show the Added/Changed/Fixed notes instead of
        # an empty body. If no matching section is found we fall back to a
        # "see CHANGELOG.md" placeholder rather than failing the build —
        # a missing note shouldn't block an APK ship.
        run: |
          VERSION_PATTERN="${{ steps.version.outputs.version }}+${{ steps.version.outputs.build }}"
          # `index()` + literal-prefix compare avoids the `+` in version
          # strings being interpreted as a regex quantifier.
          awk -v prefix="## [$VERSION_PATTERN]" '
            index($0, prefix) == 1 {found=1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG entry for $VERSION_PATTERN — falling back to placeholder." >&2
            echo "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for release notes." > release_notes.md
          fi
          echo "---- release notes body ----"
          cat release_notes.md
          echo "---- end ----"

      - name: Rename APKs
        run: |
          TAG=${{ steps.version.outputs.tag }}
          mv build/app/outputs/flutter-apk/app-arm64-v8a-release.apk build/app/outputs/flutter-apk/Trail-$TAG-arm64-v8a.apk
          mv build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk build/app/outputs/flutter-apk/Trail-$TAG-armeabi-v7a.apk
          mv build/app/outputs/flutter-apk/app-x86_64-release.apk build/app/outputs/flutter-apk/Trail-$TAG-x86_64.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.name }}
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/Trail-${{ steps.version.outputs.tag }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/Trail-${{ steps.version.outputs.tag }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/Trail-${{ steps.version.outputs.tag }}-x86_64.apk
          fail_on_unmatched_files: true
