# Builds a small on-demand tile extract for the in-app Regions
# library, triggered by Settings → Offline map → Regions → "Build
# custom region" (see `GithubApi.dispatchRegionBuild` in
# lib/services/github_api.dart).
#
# Why `pmtiles extract` against the Protomaps planet, not
# planetiler/OpenMapTiles:
# Protomaps' default vector schema ("Protomaps basemap") has been the
# published schema since Protomaps.js 0.15.1, and the bundled OSM
# Liberty style this app ships only renders correctly against the
# OpenMapTiles schema that planetiler/OMT builds produce — a
# Protomaps-schema archive "installs" fine in the app but renders as
# little more than water/landuse against that style, and vice versa
# (docs/TILES.md, gotcha 31). Rather than juggling two incompatible
# schemas, this workflow follows the path Protomaps itself sanctions
# for integrators: `pmtiles extract` a bounded region out of their
# daily-refreshed global planet build (build.protomaps.com) into a
# small, self-contained .pmtiles file. Hotlinking that planet file
# directly as a live tile source is explicitly not the supported use
# — extracting a region you then own and serve locally is.

name: build-region

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Output filename without extension (e.g. 'lake-district')"
        required: true
        type: string
      bbox:
        description: "minLon,minLat,maxLon,maxLat (decimal degrees)"
        required: true
        type: string
      maxzoom:
        description: "Max zoom level"
        required: true
        default: "13"
        type: choice
        options: ["10", "11", "12", "13", "14"]
      minzoom:
        description: "Min zoom level"
        required: false
        default: "0"
        type: string
      area:
        description: "Unused — kept only so older app builds that still send this input don't fail the dispatch. Protomaps extracts aren't split by Geofabrik area."
        required: false
        default: "great-britain"
        type: choice
        options:
          - great-britain
          - europe/ireland-and-northern-ireland
          - europe
      description:
        description: "Catalog description (shown in the app)"
        required: false
        type: string
        default: ""

# Single in-flight build at a time so two concurrent dispatches don't
# race the same planet-build resolution or clobber each other's
# release-asset upload.
concurrency:
  group: build-region
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Validate inputs
        run: |
          set -euo pipefail
          NAME="${{ inputs.name }}"
          BBOX="${{ inputs.bbox }}"
          MAXZOOM="${{ inputs.maxzoom }}"
          MINZOOM="${{ inputs.minzoom }}"

          if ! [[ "$NAME" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::name must match ^[a-z0-9-]+\$; got '$NAME'"
            exit 1
          fi

          IFS=',' read -ra B <<< "$BBOX"
          if [ "${#B[@]}" -ne 4 ]; then
            echo "::error::bbox must be 4 comma-separated numbers; got '$BBOX'"
            exit 1
          fi
          for v in "${B[@]}"; do
            if ! [[ "$v" =~ ^-?[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::bbox component '$v' is not a number"
              exit 1
            fi
          done

          if ! [[ "$MAXZOOM" =~ ^[0-9]+$ ]] || [ "$MAXZOOM" -lt 0 ] || [ "$MAXZOOM" -gt 15 ]; then
            echo "::error::maxzoom must be an integer 0-15; got '$MAXZOOM'"
            exit 1
          fi
          if ! [[ "$MINZOOM" =~ ^[0-9]+$ ]] || [ "$MINZOOM" -lt 0 ] || [ "$MINZOOM" -gt 15 ]; then
            echo "::error::minzoom must be an integer 0-15; got '$MINZOOM'"
            exit 1
          fi
          if [ "$MINZOOM" -gt "$MAXZOOM" ]; then
            echo "::error::minzoom ($MINZOOM) must be <= maxzoom ($MAXZOOM)"
            exit 1
          fi

      - name: Download go-pmtiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download v1.31.2 -R protomaps/go-pmtiles -p '*Linux_x86_64*'
          ASSET=$(ls *Linux_x86_64*)
          tar -xzf "$ASSET"
          chmod +x pmtiles
          ./pmtiles version

      - name: Resolve latest planet build
        run: |
          set -euo pipefail
          PLANET=""
          for d in "$(date -u +%Y-%m-%d)" "$(date -u -d '1 day ago' +%Y-%m-%d)" "$(date -u -d '2 days ago' +%Y-%m-%d)"; do
            URL="https://build.protomaps.com/$d.pmtiles"
            if curl -sI "$URL" | head -1 | grep -q 200; then
              PLANET="$URL"
              break
            fi
          done
          if [ -z "$PLANET" ]; then
            echo "::error::No Protomaps planet build found for today, yesterday, or the day before"
            exit 1
          fi
          echo "Using planet: $PLANET"
          echo "PLANET=$PLANET" >> "$GITHUB_ENV"

      - name: Extract region
        run: |
          set -euo pipefail
          mkdir -p out
          ./pmtiles extract "$PLANET" "out/${{ inputs.name }}.pmtiles" \
            --bbox="${{ inputs.bbox }}" \
            --minzoom="${{ inputs.minzoom }}" \
            --maxzoom="${{ inputs.maxzoom }}"
          ./pmtiles show "out/${{ inputs.name }}.pmtiles"

      - name: Verify output is under the GitHub Release 2 GB cap
        run: |
          SIZE=$(stat -c%s 'out/${{ inputs.name }}.pmtiles')
          echo "PMTiles size: $SIZE bytes ($(($SIZE / 1024 / 1024)) MB)"
          if [ "$SIZE" -gt $((2 * 1024 * 1024 * 1024)) ]; then
            echo "::error::Output exceeds GitHub's 2 GB per-asset limit. Lower the maxzoom or shrink the bbox."
            exit 1
          fi

      - name: Ensure tilesets-v1 release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view tilesets-v1 >/dev/null 2>&1 || gh release create tilesets-v1 \
            --title "Tilesets v1" \
            --notes "Curated PMTiles regions for the in-app catalog. Files here are referenced by docs/tilesets.json."

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload tilesets-v1 'out/${{ inputs.name }}.pmtiles' --clobber

      - name: Update catalog (docs/tilesets.json)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NAME='${{ inputs.name }}'
          DESC='${{ inputs.description }}'
          BBOX='${{ inputs.bbox }}'
          MINZOOM='${{ inputs.minzoom }}'
          MAXZOOM='${{ inputs.maxzoom }}'
          ASSET_URL="https://github.com/${{ github.repository }}/releases/download/tilesets-v1/${NAME}.pmtiles"
          SIZE=$(stat -c%s "out/${NAME}.pmtiles")

          # Default description if the user left it empty.
          if [ -z "$DESC" ]; then
            DESC="bbox $BBOX · zoom $MINZOOM–$MAXZOOM"
          fi

          # Atomic replace-or-append on the regions array — tag entries
          # by id so the same name re-runs as an in-place update rather
          # than duplicating.
          python3 - <<PY
          import json, pathlib
          p = pathlib.Path('docs/tilesets.json')
          data = json.loads(p.read_text())
          data.setdefault('regions', [])
          new = {
              'id': '${NAME}',
              'name': '${NAME}',
              'description': '${DESC}',
              'url': '${ASSET_URL}',
              'sizeBytes': ${SIZE},
              'bbox': '${BBOX}',
              'minzoom': int('${MINZOOM}'),
              'maxzoom': int('${MAXZOOM}'),
              'schema': 'protomaps',
          }
          data['regions'] = [r for r in data['regions'] if r.get('id') != new['id']]
          data['regions'].append(new)
          data['regions'].sort(key=lambda r: r.get('id', ''))
          p.write_text(json.dumps(data, indent=2) + '\n')
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/tilesets.json
          if git diff --cached --quiet; then
            echo "tilesets.json already up to date"
            exit 0
          fi
          git commit -m "catalog: add/update '${NAME}' (${BBOX}, z${MINZOOM}-${MAXZOOM})"
          git push origin HEAD:main
